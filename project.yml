name: BaddieBlueprint
options:
  bundleIdPrefix: com.tamarzair.baddieblueprint
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  BaddieBlueprint:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BaddieBlueprint
    info:
      path: BaddieBlueprint/Info.plist
      properties:
        CFBundleDisplayName: Baddie Blueprint
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Baddie Blueprint requires camera access to analyze your skin undertones, hair texture, and body proportions for personalized aesthetic styling."
    entitlements:
      path: BaddieBlueprint/BaddieBlueprint.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tamarzair.baddieblueprint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamarzair.baddieblueprint
    dependencies:
      - target: BaddieBlueprintWidget
        embed: true
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework

  BaddieBlueprintWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BaddieBlueprintWidget
      - path: BaddieBlueprint/Shared/SharedDefaults.swift
    info:
      path: BaddieBlueprintWidget/Info.plist
      properties:
        CFBundleDisplayName: Baddie Companion
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BaddieBlueprintWidget/BaddieBlueprintWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tamarzair.baddieblueprint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamarzair.baddieblueprint.widget
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
